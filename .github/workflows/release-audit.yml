name: Release audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "schemas/**"
      - "release/**"
      - "tests/contract/**"
      - "tests/fixtures/**"
      - "tests/integration/release/**"
      - "tests/security/**"
      - "docs/*.md"
      - "docs/v0-package-classification.json"
      - "examples/**"
      - "LICENSE"
      - "NOTICE"
      - "Makefile"
      - "tools/phase4/**"
      - "tests/phase4/**"
      - ".github/workflows/*.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          version: "0.12.8"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run python -m build
      - name: Verify artifact member policy
        run: >-
          uv run python -m open_brain.dev.artifact_policy
          --policy release/v0-artifact-policy.json
          --artifacts dist/*
      - name: Create synthetic CI denylist
        run: printf '%s\n' "ci-private-canary-${GITHUB_RUN_ID}" > "$RUNNER_TEMP/private-denylist.txt"
      - name: Audit source tree and built artifacts
        run: >-
          uv run python -m open_brain.dev.release_audit
          --root .
          --private-denylist "$RUNNER_TEMP/private-denylist.txt"
          --artifacts dist/*
      - name: Audit reachable Git history
        run: >-
          uv run python -m open_brain.dev.public_history_audit
          --repository .
          --private-denylist "$RUNNER_TEMP/private-denylist.txt"
      - name: Scan Git history with Gitleaks
        env:
          GOBIN: ${{ runner.temp }}/gitleaks-bin
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$GOBIN/gitleaks" git . --redact --no-banner
