name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.8"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: make verify-artifacts

  appliance-source-checkout-macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "0.12.8"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: >
          uv run pytest -q
          packages/app/tests/integration/services/test_appliance_upgrade.py
          packages/app/tests/integration/services/test_appliance_uninstall.py
          packages/app/tests/integration/services/test_appliance_supervisors.py
          packages/app/tests/integration/services/test_appliance_entrypoints.py
          tests/security/test_appliance_logs.py
          tests/security/test_public_result_residue.py

  phase4-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "0.12.8"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: make phase4-contracts

  connector-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30b # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.8"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q tests/phase4/test_connector_distribution.py
