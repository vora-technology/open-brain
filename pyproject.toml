[dependency-groups]
dev = [
  "build>=1.2.2,<2",
  "cryptography>=50,<51",
  "jsonschema>=4.25,<5",
  "mypy>=1.15,<2",
  "open-brain-engine==0.1.0",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.uv.workspace]
members = [
  "packages/app",
  "packages/connectors",
  "packages/engine",
  "packages/legacy",
]

[tool.uv.sources]
open-brain-engine = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
pythonpath = [
  ".",
  "packages/app/src",
  "packages/connectors/src",
  "packages/engine/src",
  "packages/legacy/src",
  "tools",
]
testpaths = [
  "tests",
  "packages/app/tests",
  "packages/connectors/tests",
  "packages/engine/tests",
  "packages/legacy/tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["open_brain", "open_brain_connectors", "open_brain_dev", "open_brain_legacy"]
known-third-party = ["open_brain_engine"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = [
  "packages/app/src",
  "packages/connectors/src",
  "packages/engine/src",
  "packages/legacy/src",
  "tools",
]
files = ["packages", "tests", "tools"]
