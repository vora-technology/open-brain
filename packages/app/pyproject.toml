[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "open-brain"
version = "0.1.0"
description = "Local-first Open Brain application."
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Open Brain contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["open-brain-engine==0.1.0"]

[project.optional-dependencies]
cloud = ["openai>=1.99,<3"]
integrations = []
mcp = []

[project.scripts]
open-brain = "open_brain.services.appliance_entrypoints:run_cli"
open-brain-mcp = "open_brain.services.appliance_entrypoints:run_mcp"

[tool.uv.sources]
open-brain-engine = { workspace = true }

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/pyproject.toml",
  "/src/open_brain",
]
exclude = ["/.gitignore"]

[tool.hatch.build.targets.sdist.force-include]
"../../README.md" = "README.md"
"../../docs/architecture.md" = "docs/architecture.md"
"../../docs/architecture/proposed-v0-system-architecture.md" = "docs/architecture/proposed-v0-system-architecture.md"
"../../docs/artifact-characterization.md" = "docs/artifact-characterization.md"
"../../docs/capture-contract.md" = "docs/capture-contract.md"
"../../docs/cli-characterization.md" = "docs/cli-characterization.md"
"../../docs/cli.md" = "docs/cli.md"
"../../docs/configuration.md" = "docs/configuration.md"
"../../docs/current-record-characterization.md" = "docs/current-record-characterization.md"
"../../docs/operations.md" = "docs/operations.md"
"../../docs/portable-brain-v1.md" = "docs/portable-brain-v1.md"
"../../docs/privacy-model.md" = "docs/privacy-model.md"
"../../docs/threat-model.md" = "docs/threat-model.md"
"../../docs/v0-expansion-backlog.md" = "docs/v0-expansion-backlog.md"
"../../docs/v0-product-contract.md" = "docs/v0-product-contract.md"
"../../docs/v0-release-boundary.md" = "docs/v0-release-boundary.md"
"../../examples/config.example.toml" = "examples/config.example.toml"
"../../examples/ios-shortcut.md" = "examples/ios-shortcut.md"
"../../examples/synthetic-vault/README.md" = "examples/synthetic-vault/README.md"
"../../release/phase4-compatibility.json" = "release/phase4-compatibility.json"
"../../release/phase4-toolchain.json" = "release/phase4-toolchain.json"
"../../release/public-history-allowlist.json" = "release/public-history-allowlist.json"
"../../release/v0-artifact-policy.json" = "release/v0-artifact-policy.json"

[tool.hatch.build.targets.wheel]
packages = ["src/open_brain"]
