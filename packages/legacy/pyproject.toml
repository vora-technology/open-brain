[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "open-brain-legacy"
version = "0.1.0"
description = "Private migration-only compatibility code for Open Brain."
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "Open Brain contributors" }]
dependencies = ["open-brain-engine==0.1.0"]

[tool.uv]
package = false

[tool.uv.sources]
open-brain-engine = { workspace = true }
