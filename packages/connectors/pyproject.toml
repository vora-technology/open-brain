[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "open-brain-connectors"
version = "0.1.0"
description = "Provisional isolated connector runtime for Open Brain."
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "Open Brain contributors" }]
dependencies = [
  "open-brain==0.1.0",
  "open-brain-engine==0.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
open-brain = { workspace = true }
open-brain-engine = { workspace = true }
